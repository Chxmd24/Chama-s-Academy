<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Linear Gradient matching header styling -->
    <linearGradient id="caBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2D4A" />
      <stop offset="50%" stop-color="#111D32" />
      <stop offset="100%" stop-color="#0B1426" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="caGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA6" />
      <stop offset="30%" stop-color="#E5C358" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>

    <!-- Subtle Gold Glow Filter -->
    <filter id="caGoldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#D4AF37" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark Navy Rounded Square Container (matching var(--radius-xl)) -->
  <rect
    x="2"
    y="2"
    width="60"
    height="60"
    rx="16"
    ry="16"
    fill="url(#caBgGrad)"
    stroke="#D4AF37"
    stroke-width="2"
    stroke-opacity="0.45"
  />

  <!-- Inner subtle accent border -->
  <rect
    x="4"
    y="4"
    width="56"
    height="56"
    rx="14"
    ry="14"
    fill="none"
    stroke="#D4AF37"
    stroke-width="0.75"
    stroke-opacity="0.15"
  />

  <!-- CA Monogram (Optimized Vector Paths for Universal Cross-Browser Fidelity) -->
  <path
    d="M 28.55 43.70 Q 25.78 45.03 21.35 45.03 Q 15.55 45.03 12.22 41.63 Q 8.89 38.22 8.89 32.53 Q 8.89 26.48 12.63 22.73 Q 16.36 18.97 22.33 18.97 Q 26.02 18.97 28.55 19.89 L 28.55 25.36 Q 26.02 23.84 22.78 23.84 Q 19.24 23.84 17.05 26.08 Q 14.88 28.31 14.88 32.13 Q 14.88 35.78 16.92 37.95 Q 18.99 40.13 22.47 40.13 Q 25.78 40.13 28.55 38.52 L 28.55 43.70 Z M 55.11 44.59 L 48.92 44.59 L 47.12 38.98 L 38.17 38.98 L 36.39 44.59 L 30.23 44.59 L 39.42 19.39 L 46.14 19.39 L 55.11 44.59 Z M 45.83 34.63 L 43.12 26.16 Q 42.83 25.20 42.70 23.89 L 42.56 23.89 Q 42.47 25.00 42.12 26.08 L 39.37 34.63 L 45.83 34.63 Z"
    fill="url(#caGoldGrad)"
    stroke="url(#caGoldGrad)"
    stroke-width="0.3"
    filter="url(#caGoldGlow)"
  />
</svg>
