# ===================================================================
# Chama's Academy - MySQL 8.0 Production / Staging Profile
#
# Activation methods:
# 1. Command Line: java -jar backend.jar --spring.profiles.active=mysql
# 2. Environment Variable: SPRING_PROFILES_ACTIVE=mysql
# 3. application.yml: spring.profiles.active: mysql
# ===================================================================
spring:
  config:
    activate:
      on-profile: mysql

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/chamas_academy?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Protect database integrity by validating schema without altering or dropping tables
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
