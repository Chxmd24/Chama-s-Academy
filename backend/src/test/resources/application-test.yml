# ===================================================================
# Chama's Academy - Isolated H2 In-Memory Database Profile for Tests
# ===================================================================
spring:
  datasource:
    url: jdbc:h2:mem:chamas_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

chamas:
  jwt:
    expiration-ms: 86400000
    secret: "dGVzdC1zZWNyZXQta2V5LWZvci1jaGFtYXMtYWNhZGVteS1hdXRoZW50aWNhdGlvbi0yNTYtYml0cyE="
  security:
    trusted-proxy-enabled: false
